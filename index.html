<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>การบ้าน: ทักทายอาจารย์</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f8ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 15px;
        }
        p {
            color: #555555;
            line-height: 1.6;
            margin-bottom: 10px;
        }
        .footer {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid #eeeeee;
            font-size: 0.9em;
            color: #888888;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>สวัสดีครับ อาจารย์! 👋</h1>
        <p>นี่คือหน้าเว็บไซต์แรกที่สร้างขึ้นเพื่อส่งการบ้านครับ/ค่ะ</p>
        <p>เว็บไซต์นี้เขียนด้วย HTML และ CSS เบื้องต้น และนำมาโฮสต์ไว้บน <strong>GitHub Pages</strong></p>
        
        <div class="footer">
            <strong>จัดทำโดย:</strong> [ใส่ชื่อ-นามสกุลของคุณที่นี่] <br>
            <strong>รหัสนักศึกษา:</strong> [ใส่รหัสนักศึกษาที่นี่]
        </div>
    </div>
</body>
</html>
