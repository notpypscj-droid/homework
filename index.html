<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แนะนำตัว - Piyapan Sucharajit</title>
    <style>
        /* กำหนดธีมสีส้มให้เข้ากับหน้าการบ้าน */
        :root {
            --gradient-orange: linear-gradient(135deg, #FF7E5F, #FEB47B);
            --bg-light: #f4f7f6;
            --text-main: #2c3e50;
            --text-muted: #666666;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-light);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ลูกเล่นแอนิเมชันให้กล่องเด้งขึ้นมาเบาๆ */
        @keyframes slideUp {
            from { transform: translateY(40px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* กล่องการ์ดแนะนำตัว */
        .profile-card {
            background-color: white;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
            padding: 40px 30px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            animation: slideUp 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
            border-top: 6px solid #FF7E5F;
        }

        /* รูปโปรไฟล์ */
        .profile-img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #FEB47B;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(255, 126, 95, 0.25);
        }

        h1 {
            color: var(--text-main);
            margin: 0 0 5px 0;
            font-size: 1.8rem;
        }

        .subtitle {
            color: #FF7E5F;
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 15px;
        }

        p {
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        /* ปุ่มกดไปดูการบ้าน */
        .btn-primary {
            display: inline-block;
            background: var(--gradient-orange);
            color: white;
            text-decoration: none;
            padding: 14px 35px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1.1rem;
            box-shadow: 0 4px 15px rgba(255, 126, 95, 0.4);
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 10px 25px rgba(255, 126, 95, 0.6);
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <!-- 1. ส่วนรูปโปรไฟล์: นำรูปตัวเองมาตั้งชื่อว่า profile.jpg แล้วอัปโหลดขึ้น GitHub -->
        <!-- หากยังไม่อัปโหลดรูป ระบบจะแสดงรูปไอคอนคนแทนชั่วคราว -->
        <img src="profile.jpg" alt="รูปโปรไฟล์ ปิยะพันธ์" class="profile-img" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3135/3135715.png'">
        
        <h1>สวัสดีครับ! 🙏</h1>
        <div class="subtitle">ผมชื่อ Piyapan Sucharajit</div>
        
        <p>
            เว็บไซต์นี้จัดทำขึ้นเพื่อส่งการบ้านใน<br>
            <strong>รายวิชา GE931-1 ปัญญาประดิษฐ์เบื้องต้น</strong><br>
            หัวข้อ: จงฝึกการใช้ Prompt ในแง่ต่างๆ 
        </p>

        <!-- 2. ปุ่มลิงก์ไปหน้าการบ้าน (ต้องตั้งชื่อไฟล์หน้า PDF ให้ตรงกับบรรทัดล่างนี้) -->
        <a href="homework.html" class="btn-primary">คลิกเพื่อดูผลงาน 🚀</a>
    </div>

</body>
</html>
